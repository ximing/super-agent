# Run ONLY on the user's cloud server. The image is produced by cloud CI.
# PostgreSQL, object storage and OIDC are external cloud services.
name: ${COMPOSE_PROJECT_NAME:-super-agent-test}
services:
  api:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE to an image in your cloud registry}
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?Cloud PostgreSQL connection required}
      JWT_SECRET: ${JWT_SECRET:?Set a random secret of at least 32 characters}
      ALLOW_DEV_AUTH: "false"
      OIDC_ISSUER: ${OIDC_ISSUER:?Cloud OIDC issuer required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?API audience required}
      OIDC_CLIENT_ID: super-agent-native
      OIDC_REDIRECT_URI: superagent://oauth/callback
      MEMORY_ENCRYPTION_KEY: ${MEMORY_ENCRYPTION_KEY:?Set a stable dedicated memory binding encryption key}
      RECALL_ALLOWED_ORIGINS: https://recall.aimo.plus
      S3_ENDPOINT: ${S3_ENDPOINT:?Private cloud S3 endpoint required}
      S3_REGION: ${S3_REGION:-cn-beijing}
      S3_BUCKET: ${S3_BUCKET:?Environment-specific bucket required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Cloud S3 service account required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Cloud S3 secret required}
      ARTIFACT_DIR: /data/artifacts
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-13011}:8787"
    volumes:
      - cloud_artifact_staging:/data/artifacts
      - ./certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  migrate:
    profiles: ["migrate"]
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE to an image in your cloud registry}
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Separate migration-owner connection required}
    volumes:
      - ./certs:/app/certs:ro
    command: ["node", "apps/control-server/dist/migrate.js"]
    restart: "no"
volumes:
  cloud_artifact_staging:
