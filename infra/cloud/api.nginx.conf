server {
    listen 80;
    server_name super-agent.aimo.plus;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name super-agent.aimo.plus;
    ssl_certificate /root/apps/nginx/ssl/aimo.plus.cer;
    ssl_certificate_key /root/apps/nginx/ssl/aimo.plus.key;
    client_max_body_size 5m;
    location / {
        # Encrypted SSH tunnel to app loopback, not plaintext over the WAN.
        proxy_pass http://192.168.0.1:13011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
