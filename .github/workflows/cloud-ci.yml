name: Cloud checks
on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.30.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @super-agent/node... build
      - run: pnpm --filter @super-agent/control-server build
      - run: pnpm --filter @super-agent/android typecheck
      - run: pnpm --filter @super-agent/protocol test
      - run: pnpm --filter @super-agent/tool-broker test
      - run: pnpm --filter @super-agent/runtime-codex test
      - run: pnpm --filter @super-agent/runtime-grok test
      - run: pnpm --filter @super-agent/node test
      - run: pnpm --filter @super-agent/control-server test
      - run: pnpm --filter @super-agent/android test
      - run: pnpm --filter @super-agent/android build
      - uses: actions/upload-artifact@v7
        with:
          name: android-javascript-bundle
          path: apps/android/dist
          if-no-files-found: error
  cloud-integration:
    # Public fork PRs must never execute on the trusted infrastructure runner.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'ximing/super-agent'
    runs-on: [self-hosted, Linux, X64, super-agent-cloud]
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_MIGRATION_DATABASE_URL: ${{ secrets.TEST_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --prefix "$RUNNER_TEMP/pnpm" pnpm@10.30.3
      - run: echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Prepare dedicated cloud test database TLS
        env:
          POSTGRES_CA_PEM: ${{ secrets.POSTGRES_CA_PEM }}
        run: node scripts/prepare-ci-database.mjs
      - run: pnpm --filter @super-agent/node... build
      - run: pnpm --filter @super-agent/control-server build
      - run: pnpm --filter @super-agent/control-server test
      - run: pnpm test:integration
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --global pnpm@10.30.3
      - run: pnpm install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/android/android
      - name: Verify standalone embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = next(Path('apps/android/android/app/build/outputs/apk/release').glob('*.apk'))
          with ZipFile(apk) as archive:
              assert archive.getinfo('assets/index.android.bundle').file_size > 1024
              assert archive.read('assets/index.android.bundle')[:8] == bytes.fromhex('c61fbc03c103191f')
          print('Standalone APK contains embedded application bundle; Metro is not required.')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: android-standalone-test-apk
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift build --package-path apps/macos
      - run: swift test --package-path apps/macos
      - run: bash apps/macos/scripts/build-app.sh
      - run: ditto -c -k --sequesterRsrc --keepParent 'apps/macos/build/Super Agent.app' super-agent-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: super-agent-macos.zip
          if-no-files-found: error
