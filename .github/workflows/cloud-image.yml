name: Build server image in cloud
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed image to GHCR
        type: boolean
        default: false
      archive:
        description: Export an image archive for direct cloud-to-cloud deployment
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build on cloud runner
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:${REVISION}"
          docker build --file infra/Dockerfile.server --tag "$image" .
          printf 'SERVER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Publish only when explicitly requested
        if: inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$SERVER_IMAGE"
      - name: Archive on cloud runner when requested
        if: inputs.archive
        run: docker save "$SERVER_IMAGE" | gzip > server-image.tar.gz
      - uses: actions/upload-artifact@v7
        if: inputs.archive
        with:
          name: server-image-${{ github.sha }}
          path: server-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
