function contextHtml(){const contextTasks=['research','report','weekly'].map(id=>tasks.find(t=>t.id===id));return `<div class="context-heading">正在推进 <small>当前工作</small></div><button class="context-task" data-detail="research" style="width:100%;text-align:left">${badge(contextTasks[0])}<h3>${contextTasks[0].title}</h3><p>${contextTasks[0].sub}</p><div class="mini-progress" aria-hidden="true"><span></span><span></span><span></span></div><div class="device-line">${icon('monitor')}Mac Studio <span style="margin-left:auto">Grok</span></div></button><button class="task-quiet" data-detail="weekly">${badge(contextTasks[2])}<h3>准备周会材料</h3><p>调研验收后继续</p></button><section class="context-section"><div class="context-heading">浏览器画面 <button class="text-link" data-action="browser">查看 ${icon('arrow-up-right','sm')}</button></div><button class="browser-thumb" data-action="browser" aria-label="查看示例浏览器画面" style="width:100%;text-align:left;padding:0"><div class="mini-browser-bar"><i></i><i></i><i></i><div class="mini-url">${icon('globe','sm').replace('class="icon sm"','style="width:7px;height:7px"')} product.example</div></div><div class="browser-page"><div class="browser-brand"><i></i>Product notes</div><h4>A little less busy.<br>A lot more done.</h4><div style="height:3px;width:106px;background:#e8e9f0;border-radius:2px"></div><div class="browser-lines"><span></span><span></span><span></span></div></div></button><div class="browser-caption"><span class="row" style="gap:4px"><span class="dot purple" style="width:4px;height:4px"></span>示例画面</span><span>采集于 14:32:08</span></div></section><section class="context-section"><div class="context-heading">最近的交付 <button class="text-link" data-nav="questions">查看全部</button></div><button class="file-row" data-action="artifact" data-file="网站性能分析.pdf"><span class="file-icon">${icon('file-text')}</span><span class="grow"><div class="file-name">网站性能分析.pdf</div><div class="file-meta">256 KB <span style="margin:0 3px">·</span> ${state.reportDone?'已验收':'待验收'}</div></span>${icon('chevron-right','sm muted')}</button><button class="file-row" data-action="artifact" data-file="项目知识索引.md"><span class="file-icon" style="background:#edf4f3;color:#6e9a90">${icon('file-text')}</span><span class="grow"><div class="file-name">项目知识索引.md</div><div class="file-meta">18 KB <span style="margin:0 3px">·</span> 已验收</div></span>${icon('chevron-right','sm muted')}</button></section><p class="context-note">模型与浏览器在你的 Mac 上运行。<br>你可以随时查看进展、暂停或补充要求。</p>`;}
function assistantHtml(){const currentTask=tasks.find(t=>t.id==='research');return `<div class="conversation"><section class="welcome"><div class="date">11 月 19 日，星期四</div><h1>下午好，席铭 <span style="color:#b7acdb;font-size:25px;font-weight:400;margin-left:4px">✳</span></h1><p>把精力留给重要的事，其余的，一起推进。${pendingCount()?`<button data-nav="questions">${pendingCount()} 件事等你处理 ${icon('chevron-right','sm')}</button>`:''}</p></section>${!state.reportDone?`<div class="attention row">${icon('inbox')}<div><strong>网站性能分析已准备好</strong><small>执行已结束，核对交付后即可完成任务</small></div><button class="btn" data-action="review">去验收 ${icon('arrow-up-right','sm')}</button></div>`:''}<div class="thread" id="thread"><div class="thread-heading">今天 · 14:24</div><div class="message"><div class="avatar user">席</div><div class="message-body"><div class="message-header">你 <time>14:24</time></div><p class="user-bubble">帮我整理一下本周 AI 编程工具的产品动态，重点看看功能和定价的变化。整理成一份简报，周会要用。</p></div></div><div class="message"><div class="avatar">${icon('sparkles','sm')}</div><div class="message-body"><div class="message-header">Super Agent <time>14:25</time></div><p>我会先查阅官方更新，再对比功能与定价，最后整理成附有来源的简报。已按你确认的方案开始执行。</p><div class="plan"><div class="plan-head row between"><div><strong>本周 AI 产品调研</strong><small>已确认的执行方案</small></div>${badge(currentTask)}</div><div class="plan-step"><span class="step-symbol">${icon('check')}</span><div><div class="title">收集产品更新</div><div class="meta">已整理 6 个产品的官方动态</div></div><span class="step-end">已验收</span></div><div class="plan-step"><span class="step-symbol running">${icon('globe')}</span><div><div class="title">对比功能与定价</div><div class="meta">正在查阅产品官网，核对变化</div></div><span class="step-end" style="color:var(--accent)">进行中</span></div><div class="plan-step"><span class="step-symbol waiting">${icon('file-text')}</span><div><div class="title">整理调研简报</div><div class="meta">前置任务验收通过后开始</div></div><span class="step-end">等待中</span></div><div class="plan-foot"><span class="row" style="gap:5px">${icon('monitor','sm')}Mac Studio <span style="color:#d7d9e4;margin:0 3px">/</span> Grok</span><button class="text-link" data-detail="research">查看任务 ${icon('chevron-right','sm')}</button></div></div><div class="assistant-foot"><span class="tiny-activity" aria-hidden="true"><i></i><i></i><i></i></span>${currentTask.state==='paused'?'任务已暂停 · 你可以在任务详情中继续':'正在执行 · 有新结果时会在这里告诉你'}</div></div></div>${state.messages.map(m=>`<div class="message"><div class="avatar ${m.role==='user'?'user':''}">${m.role==='user'?'席':icon('sparkles','sm')}</div><div class="message-body"><div class="message-header">${m.role==='user'?'你':'Super Agent'}<time>刚刚</time></div><p class="${m.role==='user'?'user-bubble':''}">${esc(m.text)}</p></div></div>`).join('')}</div><div class="composer-area"><form class="composer" id="composer-form">${state.attachment?`<div class="attachment-chip">${icon('paperclip','sm')}${esc(state.attachment)}<button type="button" data-action="remove-attachment" aria-label="移除附件">${icon('x','sm')}</button></div>`:''}<textarea id="composer-input" aria-label="发送给助理" placeholder="说说你想做的事，或补充一个想法…" rows="2"></textarea><div class="row composer-tools"><button class="icon-btn" type="button" data-action="attach" aria-label="添加附件">${icon('plus','sm')}</button><button class="config-button" type="button" data-action="execution">${icon('sparkles')}${esc(state.engine)}${icon('chevron-down')}</button><button class="config-button" type="button" data-action="execution">${icon('monitor')}${esc(state.device)}${icon('chevron-down')}</button><button class="config-button model-chip" type="button" data-action="execution">${esc(state.model)}${icon('chevron-down')}</button><span class="grow"></span><kbd style="font-size:9px;border:0;background:none">⌘ ↵</kbd><button type="submit" class="send-button" aria-label="发送消息">${icon('arrow-up','sm')}</button></div></form><div class="composer-note">${icon('shield-check')}模型请求从所选 Mac 发出 <span style="margin:0 3px">·</span> 自由交办将在方案确认后开始执行</div></div></div>`;}
function taskPage(){let filtered=tasks.filter(t=>state.filter==='all'||state.filter==='active'&&['running','blocked','paused','question'].includes(t.state)||state.filter==='review'&&t.state==='review'||state.filter==='done'&&t.state==='done');return `<section class="page"><div class="page-intro"><div><h1>每一件事，都有着落</h1><p>查看执行进展、交付结果，以及接下来需要你的地方。</p></div><button class="btn primary" data-action="new">${icon('plus','sm')}新任务</button></div><div class="row between"><div style="font-size:12px;font-weight:550">全部工作 <span class="muted" style="font-size:10px;margin-left:6px">${tasks.length}</span></div><button class="btn small" data-action="search">${icon('search','sm')}搜索任务</button></div><div class="tabs">${[['all','全部'],['active','进行中'],['review','待验收'],['done','已完成']].map(([id,label])=>`<button data-filter="${id}" class="${state.filter===id?'active':''}">${label}<span>${tasks.filter(t=>id==='all'||id==='active'&&['running','blocked','paused','question'].includes(t.state)||id==='review'&&t.state==='review'||id==='done'&&t.state==='done').length}</span></button>`).join('')}</div>${filtered.length?`<table class="task-table"><thead><tr><th>任务</th><th>状态</th><th>执行方式</th><th>最近更新</th></tr></thead><tbody>${filtered.map(t=>`<tr data-detail="${t.id}" tabindex="0" role="button" aria-label="查看${esc(t.title)}"><td><div class="task-title">${icon(t.icon,'sm muted')}${esc(t.title)}</div><div class="task-sub">${esc(t.sub)}</div></td><td>${badge(t)}</td><td><div>${esc(t.device)}</div><div class="muted" style="font-size:10px;margin-top:5px">${esc(t.engine)}</div></td><td class="muted">${esc(t.time)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">这里暂时没有任务。</div>'}<p class="muted" style="font-size:10px;margin-top:19px">任务执行结束后进入待验收。核对交付通过后，才会标记为完成。</p></section>`;}
function questionsPage(){return `<section class="page"><div class="page-intro"><div><h1>需要你的一点判断</h1><p>助理会继续推进其他工作，这些事项等你方便时处理。</p></div><span class="pill purple">${pendingCount()} 件待处理</span></div>${!state.reportDone?`<article class="review-card"><div class="row between"><span class="pill amber">${icon('circle-check','sm')}待验收</span><small class="muted">10 分钟前</small></div><h2>上周网站性能分析</h2><p class="summary">已产出性能报告和页面数据。请按 2 项交付标准核对证据，验收通过后完成任务。</p><div class="actions"><button class="btn primary small" data-action="review">核对交付</button><button class="btn small" data-detail="report">查看任务</button></div></article>`:''}${!state.questionDone?`<article class="review-card"><div class="row between"><span class="pill purple">${icon('message-square','sm')}待回答</span><small class="muted">32 分钟前</small></div><h2>这次反馈，按什么范围整理？</h2><p class="summary">「汇总用户反馈」收到了两个渠道的数据。你希望只看付费用户，还是覆盖全部用户？</p><div class="actions"><button class="btn small" data-answer="全部用户">全部用户</button><button class="btn small" data-answer="仅付费用户">仅付费用户</button><button class="btn small" data-action="custom-answer">补充说明</button></div></article>`:''}${pendingCount()===0?`<div class="empty">${icon('check-check','lg')}<h2 style="margin:16px 0 7px">需要你的事，都处理好了</h2><p>有新的问题或交付时，会在这里提醒你。</p></div>`:''}</section>`;}
function devicesPage(){return `<section class="page"><div class="page-intro"><div><h1>工作在你的电脑上发生</h1><p>管理执行设备，为每项工作选择合适的电脑与引擎。</p></div><button class="btn" data-action="pair">${icon('plus','sm')}连接电脑</button></div><div class="grid-cards">${[['Mac Studio','主助理电脑','M4 Max · 64 GB','Grok、Codex'],['MacBook Pro','执行电脑','M3 Pro · 36 GB','Codex']].map(([name,role,spec,engines])=>`<div class="info-card"><div class="row between">${icon('monitor','lg')}<span class="pill green"><span class="dot"></span>在线</span></div><h2>${name}</h2><p>${spec}</p><div class="kv"><span class="muted">用途</span><span>${role}</span></div><div class="kv"><span class="muted">已配置引擎</span><span>${engines}</span></div><div class="kv"><span class="muted">最近连接</span><span>刚刚</span></div><button class="btn small" data-action="execution" style="width:100%;margin-top:14px">选择执行方式</button></div>`).join('')}</div><div class="section-label">设备与隐私</div><p class="muted" style="font-size:12px;line-height:1.9">模型凭据、浏览器与执行过程保留在你的 Mac 上。所选电脑离线时，任务会等待它重新连接。</p></section>`;}
function memoriesPage(){return `<section class="page memory-list"><div class="page-intro"><div><h1>越合作，越懂你的习惯</h1><p>有来源的经验可以复用，待确认的内容由你决定是否保留。</p></div><button class="btn" data-action="memory-new">${icon('plus','sm')}添加记忆</button></div><div class="section-label">已验证</div><div class="info-card"><div class="row between"><span class="pill green">工作偏好</span><small class="muted">更新于昨天</small></div><h2>调研结论附上原始来源</h2><p>输出产品调研时，优先使用官方资料；结论与来源放在一起，标明资料日期。</p></div><div class="info-card"><span class="pill green">项目约定</span><h2>服务部署在云端，执行保留在 Mac</h2><p>服务器承担调度与存储，模型、浏览器和凭据留在各自的 Mac 上。</p></div><div class="section-label">待你确认</div><div class="info-card" id="memory-candidate"><span class="pill amber">候选记忆</span><h2>周会材料采用「结论、证据、下一步」结构</h2><p>来自本周的任务反馈，确认后用于后续材料。</p><div class="row" style="margin-top:16px"><button class="btn small soft" data-action="memory-accept">确认保留</button><button class="btn small" data-action="memory-dismiss">暂不保留</button></div></div></section>`;}
function schedulesPage(){return `<section class="page"><div class="page-intro"><div><h1>重要的事，按时想起</h1><p>到点提醒并准备工作目标，经你确认后再开始执行。</p></div><button class="btn" data-action="schedule-new">${icon('plus','sm')}添加关注</button></div><div class="info-card"><div class="row between"><span class="pill ${state.schedule?'purple':''}">${state.schedule?'下次：周五 09:00':'已暂停'}</span><button class="btn small" data-action="schedule-toggle">${icon(state.schedule?'pause':'play','sm')}${state.schedule?'暂停':'开启'}</button></div><h2>准备每周产品动态</h2><p>每周五 09:00，提醒我整理本周 AI 产品的功能与定价变化，准备周会材料。</p><div class="kv"><span class="muted">时区</span><span>Asia/Shanghai</span></div><div class="kv"><span class="muted">执行方式</span><span>提醒后由你确认</span></div></div></section>`;}
function costsPage(){return `<section class="page"><div class="page-intro"><div><h1>投入，清清楚楚</h1><p>按实际用量了解每项工作的成本，未知金额单独列出。</p></div><span class="btn small">本周 · 11/16 – 11/22</span></div><div class="grid-cards"><div class="info-card"><p>本周已知用量金额</p><div class="cost-total">$ 4.28</div><p>示例数据，按供应商返回用量汇总</p><div class="bars">${[26,59,43,88,70,48,115].map((h,i)=>`<div class="bar" style="height:${h}px"><span>${['五','六','日','一','二','三','四'][i]}</span></div>`).join('')}</div><div style="height:21px"></div></div><div class="info-card"><div class="row between"><h3>按执行引擎</h3>${icon('cpu','sm muted')}</div><div class="kv"><span>Grok</span><strong>$ 4.28</strong></div><div class="kv"><span>Codex 订阅用量</span><span class="pill amber">金额未知</span></div><p style="margin-top:16px">订阅内用量没有可靠的逐任务金额，单独记录，不计作零成本。</p><hr><h3>最近用量</h3><div class="kv"><span>整理本周 AI 产品动态</span><span>$ 0.62</span></div><div class="kv"><span>汇总用户反馈</span><span>$ 0.18</span></div></div></div></section>`;}
function render(){renderNav();$('#breadcrumb').textContent=navs.find(n=>n[0]===state.page)[2];$('#main').innerHTML=({assistant:assistantHtml,tasks:taskPage,questions:questionsPage,devices:devicesPage,memories:memoriesPage,schedules:schedulesPage,costs:costsPage})[state.page]();$('#context').innerHTML=contextHtml();$('#context').hidden=!(state.page==='assistant'&&state.context);$('#content').classList.toggle('no-context',!(state.page==='assistant'&&state.context));$('.context-toggle').setAttribute('aria-expanded',String(state.context));$('.context-toggle').setAttribute('aria-label',state.context?'收起上下文侧栏':'展开上下文侧栏');$('.context-toggle').innerHTML=icon(state.context?'panel-right-close':'panel-right-open');hydrate();}
function navigate(page){state.page=page;$('#app').classList.remove('nav-open');render();$('#main').scrollTop=0;}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200)}
function openModal(title,body,footer=''){const dialog=$('#modal');if(dialog.open)dialog.close();dialog.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="关闭窗口">${icon('x')}</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-footer">${footer}</div>`:''}`;dialog.showModal();hydrate(dialog);}
function newTask(){openModal('交办一项新工作',`<form id="new-task-form"><div class="field"><label for="new-goal">你希望完成什么？</label><textarea id="new-goal" placeholder="描述目标、期望的交付物，以及需要注意的事…" required></textarea></div><div class="fields-row"><div class="field"><label for="new-engine">执行引擎</label><select id="new-engine"><option>Grok</option><option>Codex</option></select></div><div class="field"><label for="new-device">执行电脑</label><select id="new-device"><option>Mac Studio</option><option>MacBook Pro</option></select></div></div><div class="field"><label for="new-delivery">交付标准</label><input id="new-delivery" placeholder="例如：一份包含来源链接的调研简报" required><small>直接创建即交办此范围内的工作。此设计稿只添加本地示例任务。</small></div></form>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" type="submit" form="new-task-form">创建任务</button>`);}
function detail(id,tab='overview'){state.detail=id;state.detailTab=tab;const t=tasks.find(t=>t.id===id);if(!t)return;openModal('任务详情',`${badge(t)}<h1 class="detail-title">${esc(t.title)}</h1><div class="detail-meta"><span>${icon('monitor','sm')}${esc(t.device)}</span><span>${icon('sparkles','sm')}${esc(t.engine)}</span><span>${icon('clock-3','sm')}${esc(t.time)}</span></div><div class="tabs detail-tabs">${[['overview','概览'],['process','执行过程'],['delivery','交付物']].map(([key,label])=>`<button data-detail-tab="${key}" class="${tab===key?'active':''}">${label}</button>`).join('')}</div>${detailContent(t,tab)}`,`${t.state==='running'?`<button class="btn" data-action="pause-task">${icon('pause','sm')}暂停任务</button>`:t.state==='paused'?`<button class="btn" data-action="resume-task">${icon('play','sm')}继续任务</button>`:''}<span class="grow"></span>${t.state==='review'?'<button class="btn primary" data-action="review">核对交付</button>':'<button class="btn primary" data-action="task-input">补充要求</button>'}`);}
function detailContent(t,tab){if(tab==='overview')return `<h3>工作目标</h3><p class="detail-description" style="margin-top:10px">${esc(t.goal)}</p><hr><h3>当前进展</h3><p class="detail-description" style="margin-top:10px">${esc(t.sub)}</p>${t.id==='research'?'<hr><h3>已加载的前置关系</h3><p class="detail-description" style="margin-top:10px">收集产品更新（已验收） → 对比功能与定价（进行中） → 整理调研简报（等待中）</p><p class="muted" style="font-size:10px;margin-top:8px">只呈现当前示例中已加载的关系。</p>':''}`;if(tab==='process')return `<p class="muted" style="font-size:10px;margin-bottom:10px">工具记录仅显示安全的动作摘要。</p>${[['14:25','接收任务并准备执行','已选择 '+t.device],['14:26','读取相关资料','已完成'],['14:29',t.state==='running'?'查阅官网并核对信息':'整理交付材料',t.state==='running'?'进行中':'执行已结束']].map(([time,title,sub],i)=>`<div class="timeline-row"><span class="time">${time}</span><span class="step-symbol ${i===2&&t.state==='running'?'running':''}">${icon(i===2&&t.state==='running'?'globe':'check')}</span><div><h3>${title}</h3><p>${esc(sub)}</p></div></div>`).join('')}`;return t.id==='report'?`<p class="muted" style="font-size:11px;margin-bottom:15px">执行已结束，以下示例交付等待你核对。</p>${['网站性能分析.pdf','页面指标对比.csv'].map(file=>`<button class="file-row" data-action="artifact" data-file="${file}"><span class="file-icon">${icon('file-text')}</span><span class="grow">${file}</span>${icon('external-link','sm muted')}</button>`).join('')}`:t.state==='done'?'<p class="detail-description">交付已验收通过。</p><button class="file-row" data-action="artifact" data-file="项目知识索引.md">项目知识索引.md</button>':'<div class="empty">交付还在准备中，准备好后会在这里显示。</div>';}
function review(){openModal('核对交付',`<span class="pill amber">执行结束 · 待验收</span><h2 style="margin:14px 0 9px">上周网站性能分析</h2><p class="review-description">打开交付材料，逐条核对标准并选择对应证据。通过后才会将任务标记为完成。</p><div class="row" style="margin:15px 0"><button class="btn small" data-action="artifact" data-file="网站性能分析.pdf" data-return-review="true">${icon('file-text','sm')}打开示例报告</button><button class="btn small" data-action="artifact" data-file="页面指标对比.csv" data-return-review="true">${icon('file-text','sm')}查看示例数据</button></div><form id="review-form">${['覆盖两周主要页面的加载指标对比','指出退化页面并提供有数据依据的优化建议'].map((text,i)=>`<div class="criterion"><label><input type="checkbox" class="review-check" required>${text}</label><select class="review-evidence" aria-label="第 ${i+1} 项的核对证据" required><option value="">选择你已核对的证据</option><option value="report">网站性能分析.pdf</option><option value="data">页面指标对比.csv</option></select></div>`).join('')}<div class="field" style="margin-top:20px"><label for="review-note">验收说明</label><textarea id="review-note" style="min-height:75px" placeholder="记录你的核对依据，或需要补充的内容" required></textarea></div><small class="muted">这里演示验收流程，示例状态仅保留在当前页面。</small></form>`,`<button class="btn" data-action="reject-review">退回补充</button><button class="btn primary" type="submit" form="review-form" id="accept-review" disabled>验收通过</button>`);}
function updateReview(){const checks=[...document.querySelectorAll('.review-check')];const evidence=[...document.querySelectorAll('.review-evidence')];const accept=$('#accept-review');if(accept)accept.disabled=!(checks.every(x=>x.checked)&&evidence.every(x=>x.value)&&$('#review-note').value.trim());}
function execution(){openModal('选择执行方式',`<form id="execution-form"><div class="field"><label for="exec-engine">执行引擎</label><select id="exec-engine"><option ${state.engine==='Grok'?'selected':''}>Grok</option><option ${state.engine==='Codex'?'selected':''}>Codex</option></select></div><div class="field"><label for="exec-device">执行电脑</label><select id="exec-device"><option ${state.device==='Mac Studio'?'selected':''}>Mac Studio</option><option ${state.device==='MacBook Pro'?'selected':''}>MacBook Pro</option></select></div><div class="field"><label for="exec-model">模型</label><select id="exec-model"><option>本机默认</option></select><small>实际模型列表由所选电脑提供。MacBook Pro 当前仅配置 Codex。</small></div></form>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" type="submit" form="execution-form">保存选择</button>`);}
const artifacts={
 '网站性能分析.pdf':`<h2>网站性能分析</h2><p class="muted" style="font-size:11px;margin:8px 0 22px">11 月 9 日 – 11 月 15 日，与前一周对比 · 示例内容</p><h3>结论</h3><p class="detail-description" style="margin-top:10px">商品详情页的加载耗时出现上升，主要变化集中在脚本下载与首屏渲染阶段。建议优先拆分首屏非必要脚本，并压缩头图资源。</p><hr><h3>关键数据</h3><div class="kv row between" style="padding:13px 0"><span>商品详情 · TP90</span><span>2.4 s → 3.1 s</span></div><div class="kv row between" style="padding:13px 0;border-top:1px solid var(--line)"><span>首页 · TP90</span><span>1.8 s → 1.9 s</span></div><hr><h3>建议</h3><p class="detail-description" style="margin-top:10px">优先检查详情页新增的脚本体积；将非首屏模块延迟加载，再观察对应页面的指标变化。</p>`,
 '页面指标对比.csv':`<h2>页面指标对比</h2><p class="muted" style="font-size:11px;margin:10px 0 20px">示例数据 · 秒</p><table class="task-table"><thead><tr><th>页面</th><th>前一周 TP90</th><th>最近一周 TP90</th></tr></thead><tbody><tr><td>商品详情</td><td>2.4</td><td>3.1</td></tr><tr><td>首页</td><td>1.8</td><td>1.9</td></tr><tr><td>搜索结果</td><td>2.1</td><td>2.0</td></tr></tbody></table>`,
 '项目知识索引.md':`<h2>项目知识索引</h2><p class="detail-description">已按「产品目标、架构约定、交付流程」整理项目资料。每个条目保留原始来源，便于后续核对与更新。</p><hr><h3>产品目标</h3><p class="detail-description">在自己的 Mac 上运行助理，从任何设备交办工作、了解过程并核对交付。</p><hr><h3>交付流程</h3><p class="detail-description">目标确认 → 执行 → 准备交付 → 逐条核对证据 → 验收完成。</p>`
};
function artifact(name,back=false){openModal('交付预览',artifacts[name]||'<p>这份示例交付尚未准备好。</p>',`<span class="prototype-info">${esc(name)} · 示例预览</span>${back?'<button class="btn primary" data-action="review">返回验收</button>':'<button class="btn" data-action="close">关闭</button>'}`);}
function answer(text){state.questionDone=true;const t=tasks.find(t=>t.id==='feedback');t.state='running';t.label='进行中';t.sub='已按「'+text+'」继续整理';$('#modal').close();render();toast('已回答：'+text+'。示例任务已继续。');}
function search(){const d=$('#search-modal');d.showModal();$('#search-input').value='';searchResults('');setTimeout(()=>$('#search-input').focus(),0)}
function searchResults(q){const result=tasks.filter(t=>(t.title+t.sub).includes(q));const pages=navs.filter(n=>!q||n[2].includes(q));$('#search-results').innerHTML=(result.length?`<div style="padding:9px 13px;color:var(--muted);font-size:10px">任务</div>`+result.map(t=>`<button class="search-result" data-search-detail="${t.id}">${icon(t.icon,'muted')}<span>${esc(t.title)}<small>${esc(t.label)} · ${esc(t.device)}</small></span></button>`).join(''):'')+(pages.length?`<div style="padding:12px 13px 5px;color:var(--muted);font-size:10px">工作台</div>`+pages.map(([id,i,title])=>`<button class="search-result" data-search-nav="${id}">${icon(i,'muted')}<span>${title}</span>${icon('arrow-up-right','sm muted')}</button>`).join(''):'')||'<div class="empty">没有找到匹配的内容，换个关键词试试。</div>';}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-detail]');if(!el)return;
 if(el.dataset.nav){navigate(el.dataset.nav);return}if(el.dataset.detail){detail(el.dataset.detail);return}if(el.dataset.filter){state.filter=el.dataset.filter;render();return}if(el.dataset.detailTab){detail(state.detail,el.dataset.detailTab);return}if(el.dataset.answer){answer(el.dataset.answer);return}if(el.dataset.searchDetail){$('#search-modal').close();detail(el.dataset.searchDetail);return}if(el.dataset.searchNav){$('#search-modal').close();navigate(el.dataset.searchNav);return}
 switch(el.dataset.action){
 case 'new':newTask();break;case 'close':$('#modal').close();break;case 'search':search();break;case 'review':review();break;case 'execution':execution();break;case 'menu':$('#app').classList.toggle('nav-open');break;case 'context':state.context=!state.context;render();break;
 case 'attach':$('#attachment').click();break;case 'remove-attachment':state.attachment='';render();break;
 case 'artifact':artifact(el.dataset.file,el.dataset.returnReview==='true');break;
 case 'pause-task':{const t=tasks.find(t=>t.id===state.detail);t.state='paused';t.label='已暂停';t.sub='任务已暂停，等待你继续';render();detail(t.id);toast('示例任务已暂停');break}
 case 'resume-task':{const t=tasks.find(t=>t.id===state.detail);t.state='running';t.label='进行中';t.sub='正在继续执行';render();detail(t.id);toast('示例任务已继续');break}
 case 'task-input':openModal('补充任务要求',`<form id="task-input-form"><p class="muted" style="font-size:11px;margin-bottom:18px">只发送到「${esc(tasks.find(t=>t.id===state.detail).title)}」，不会发到主助理对话。</p><div class="field"><label for="task-note">补充内容</label><textarea id="task-note" required placeholder="例如：请重点比较团队版的价格"></textarea></div></form>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" form="task-input-form" type="submit">发送到任务</button>`);break;
 case 'custom-answer':openModal('回答助理的问题',`<form id="answer-form"><p style="margin-bottom:20px;font-size:12px">这次反馈，按什么范围整理？</p><div class="field"><label for="answer-note">你的说明</label><textarea id="answer-note" required></textarea></div></form>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" form="answer-form" type="submit">回答并继续</button>`);break;
 case 'reject-review':if(!$('#review-note').value.trim()){$('#review-note').focus();toast('请说明需要补充的内容');return}tasks.find(t=>t.id==='report').sub='交付已退回，等待补充';$('#modal').close();render();toast('示例交付已退回，等待补充；未重新执行任务');break;
 case 'browser':openModal('浏览器画面',`<div class="row between"><span class="pill purple">${icon('monitor','sm')}Mac Studio</span><small class="muted">示例画面 · 采集于 14:32:08</small></div><div style="margin-top:20px;border:1px solid var(--line);border-radius:10px;overflow:hidden"><div class="mini-browser-bar" style="height:35px"><i></i><i></i><i></i><div class="mini-url" style="font-size:10px">product.example</div></div><div class="browser-page" style="height:260px;padding:30px"><div class="browser-brand" style="font-size:13px"><i></i>Product notes</div><h4 style="font-size:33px;max-width:400px;margin-top:30px">A little less busy.<br>A lot more done.</h4><div class="browser-lines"><span style="height:48px"></span><span style="height:48px"></span><span style="height:48px"></span></div></div></div><p class="muted" style="font-size:10px;margin-top:15px">此处为 HTML 画面示意。Swift 客户端落地时显示实际采集时间与连接状态。</p>`,`<button class="btn" data-action="close">关闭画面</button>`);break;
 case 'settings':openModal('工作台偏好',`<h3>通知</h3><div class="row between" style="margin:17px 0 25px"><span class="muted" style="font-size:12px">有问题或交付时提醒我</span><input id="notice-toggle" type="checkbox" style="accent-color:var(--accent);width:17px;height:17px" ${state.showNotice?'checked':''} aria-label="接收通知"></div><h3>关于这份设计稿</h3><p class="detail-description" style="margin-top:10px">为 SwiftUI 原生工作台设计的交互预览。所有任务、交付与设备均为示例，操作不会连接真实服务。</p><p class="muted" style="font-size:11px;margin-top:12px">图标：Lucide 0.468.0。原生落地可替换为 SF Symbols。</p>`,`<button class="btn primary" data-action="save-settings">完成</button>`);break;
 case 'save-settings':state.showNotice=$('#notice-toggle').checked;$('#modal').close();toast('已保存本次预览的偏好');break;
 case 'pair':openModal('连接一台 Mac',`<p class="detail-description" style="margin:0">原生客户端会在这里展示当前配对流程。请在需要执行任务的 Mac 上打开 Super Agent，并按提示完成设备配对。</p><div class="info-card" style="margin-top:20px;background:var(--bg)"><h3>连接后，你可以</h3><p style="margin-top:10px">为任务选择这台电脑，查看可用引擎和连接状态。模型凭据始终保留在设备上。</p></div>`,`<button class="btn primary" data-action="close">知道了</button>`);break;
 case 'memory-accept':$('#memory-candidate').innerHTML='<span class="pill green">已验证</span><h2>周会材料采用「结论、证据、下一步」结构</h2><p>已在本次预览中确认保留。</p>';toast('示例记忆已确认');break;
 case 'memory-dismiss':$('#memory-candidate').remove();toast('已移除候选记忆');break;
 case 'memory-new':openModal('添加一条记忆',`<form id="memory-form"><div class="field"><label for="memory-content">希望助理记住什么？</label><textarea id="memory-content" required placeholder="一项偏好、一条约定，或值得复用的经验"></textarea></div></form>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" form="memory-form" type="submit">保存记忆</button>`);break;
 case 'schedule-toggle':state.schedule=!state.schedule;render();toast(state.schedule?'已开启示例关注':'已暂停示例关注');break;
 case 'schedule-new':openModal('添加定时关注',`<form id="schedule-form"><div class="field"><label for="schedule-name">关注内容</label><input id="schedule-name" required placeholder="例如：准备每周产品动态"></div><div class="fields-row"><div class="field"><label for="schedule-day">提醒频率</label><select id="schedule-day"><option>每天</option><option>每周一</option><option>每周五</option></select></div><div class="field"><label for="schedule-time">时间</label><input id="schedule-time" type="time" value="09:00" required></div></div><p class="muted" style="font-size:11px">时区 Asia/Shanghai。到点提醒，经你确认后执行。</p></form>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" form="schedule-form" type="submit">添加关注</button>`);break;
 }
});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;
 if(id==='composer-form'){const value=$('#composer-input').value.trim();if(!value)return;state.messages.push({role:'user',text:value},{role:'assistant',text:'这是设计稿中的消息预览。正式版本会由所选 Mac 上的助理处理；新的工作方案仍需你确认后执行。'});state.attachment='';render();$('#thread').scrollTop=$('#thread').scrollHeight;$('#composer-input').focus();}
 if(id==='new-task-form'){const value=$('#new-goal').value.trim(),delivery=$('#new-delivery').value.trim();if(!value||!delivery)return;tasks.unshift({id:'local-'+Date.now(),title:value.length>24?value.slice(0,24)+'…':value,goal:value+'\n交付标准：'+delivery,state:'blocked',label:'待执行',engine:$('#new-engine').value,device:$('#new-device').value,time:'刚刚',sub:'本地示例任务，未连接执行服务',icon:'file-text'});$('#modal').close();navigate('tasks');toast('示例任务已创建');}
 if(id==='execution-form'){const engine=$('#exec-engine').value,device=$('#exec-device').value;if(engine==='Grok'&&device==='MacBook Pro'){toast('这台电脑尚未配置 Grok，请选择 Codex 或 Mac Studio');return}state.engine=engine;state.device=device;state.model=$('#exec-model').value;$('#modal').close();render();toast('已更新此对话的执行方式');}
 if(id==='review-form'){if($('#accept-review').disabled)return;state.reportDone=true;const t=tasks.find(t=>t.id==='report');t.state='done';t.label='已验收';t.sub='已核对全部交付标准';$('#modal').close();render();toast('示例交付已验收，任务已完成');}
 if(id==='answer-form')answer($('#answer-note').value.trim());
 if(id==='task-input-form'){if(!$('#task-note').value.trim())return;$('#modal').close();toast('补充要求已发送到示例任务');}
 if(id==='memory-form'){const value=$('#memory-content').value.trim();if(!value)return;$('#modal').close();if(state.page!=='memories')navigate('memories');const item=document.createElement('div');item.className='info-card';item.innerHTML='<span class="pill green">已验证</span><h2>'+esc(value)+'</h2><p>由你手动添加 · 本次预览</p>';$('.memory-list').append(item);toast('示例记忆已保存');}
 if(id==='schedule-form'){const name=$('#schedule-name').value.trim();if(!name)return;const frequency=$('#schedule-day').value,time=$('#schedule-time').value;$('#modal').close();const item=document.createElement('div');item.className='info-card';item.style.marginTop='16px';item.innerHTML=`<span class="pill purple">${esc(frequency)} ${esc(time)}</span><h2>${esc(name)}</h2><p>提醒后由你确认执行 · 本次预览</p>`;$('.page').append(item);toast('示例定时关注已添加');}
});
document.addEventListener('input',e=>{if(e.target.id==='search-input')searchResults(e.target.value.trim());if(e.target.closest('#review-form'))updateReview()});
document.addEventListener('change',e=>{if(e.target.closest('#review-form'))updateReview();if(e.target.id==='attachment'&&e.target.files[0]){state.attachment=e.target.files[0].name;render();toast('已添加附件名称预览，文件未上传');e.target.value='';}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#search-modal').open)search();}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&$('#composer-form')&&!$('#modal').open&&!$('#search-modal').open){e.preventDefault();$('#composer-form').requestSubmit();}if(e.key==='Escape')$('#app').classList.remove('nav-open');if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-detail]')){e.preventDefault();detail(e.target.dataset.detail);}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
render();
</script>
</body>
</html>
