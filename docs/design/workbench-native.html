function openMemoryMenu(anchor) {
 const memory=selectedMemory();if(!memory)return;
 const pop=$('#memory-actions-popover');
 pop.innerHTML=`<button data-memory-action="source">${icon('circle-help','sm')}来源与范围</button><button data-memory-action="edit">${icon('file-text','sm')}编辑内容</button><hr><button class="memory-danger" data-memory-action="delete">${icon('x','sm')}删除记忆…</button>`;
 const rect=anchor.getBoundingClientRect();pop.style.left=Math.max(12,Math.min(rect.right-175,innerWidth-187))+'px';pop.style.top=(rect.bottom+6)+'px';pop.showPopover();
}
function deleteMemoryDialog() {
 const memory=selectedMemory();if(!memory)return;
 sheet('删除这条记忆？',`<div class="memory-confirm-delete">${icon('triangle-alert')}<div><strong>${esc(memory.title)}</strong>删除后，后续任务将不再检索这条记忆。<small>此操作没有撤销入口。设计稿只删除本页示例数据。</small></div></div>`,'<button class="native-button" data-action="close-sheet">取消</button><button class="native-button memory-danger" data-memory-delete-confirm="'+memory.id+'">删除记忆</button>','核对后再删除');
}
function memorySaveEdit() {
 const memory=selectedMemory(),draft=memory&&memoryState.drafts[memory.id];if(!draft)return;
 if(!draft.title.trim()||!draft.content.trim()){
  const el=!draft.title.trim()?$('#memory-edit-title'):$('#memory-edit-content');
  if(!el)return;el.setCustomValidity('请填写'+(!draft.title.trim()?'标题':'内容'));el.reportValidity();return;
 }
 Object.assign(memory,{title:draft.title.trim(),content:draft.content.trim(),type:draft.type,site:draft.site.trim(),updated:'刚刚',version:memory.version+1});
 delete memoryState.drafts[memory.id];memoryState.notice=memory.status==='candidate'?'已保存，仍待审核':'修改已保存';
 refreshMemoryPane();
}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.memorySelect){selectMemory(button.dataset.memorySelect);return}
 if(button.dataset.memoryFilter){memoryState.filter=button.dataset.memoryFilter;memoryState.mobileDetail=false;reconcileMemorySelection();render();return}
 if(button.dataset.memoryTab){memoryState.tab=button.dataset.memoryTab;refreshMemoryPane();return}
 if(button.dataset.memoryDeleteConfirm){const id=button.dataset.memoryDeleteConfirm,index=memoryRecords.findIndex(memory=>memory.id===id);if(index>=0)memoryRecords.splice(index,1);delete memoryState.drafts[id];closeSheet();reconcileMemorySelection();memoryState.notice='示例记忆已删除';render();return}
 const action=button.dataset.memoryAction;if(!action)return;
 const pop=$('#memory-actions-popover');if(pop.matches(':popover-open'))pop.hidePopover();
 switch(action){
  case 'connection':memoryConnection();break;
  case 'clear-search':memoryState.query='';reconcileMemorySelection();render();$('#memory-search')?.focus();break;
  case 'reset-filters':memoryState.query='';memoryState.filter='all';memoryState.type='all';reconcileMemorySelection();render();break;
  case 'back':memoryState.mobileDetail=false;$('.memory-workspace').classList.remove('memory-detail-open');break;
  case 'edit':{const memory=selectedMemory();if(!memory)return;memoryState.tab='content';memoryState.drafts[memory.id]||={title:memory.title,content:memory.content,type:memory.type,site:memory.site};refreshMemoryPane();$('#memory-edit-title')?.focus();break}
  case 'cancel-edit':{const memory=selectedMemory();if(memory)delete memoryState.drafts[memory.id];refreshMemoryPane();break}
  case 'save-edit':memorySaveEdit();break;
  case 'source':memoryState.tab='source';refreshMemoryPane();break;
  case 'more':openMemoryMenu(button);break;
  case 'delete':deleteMemoryDialog();break;
  case 'publish':{const memory=selectedMemory();if(!memory||memory.status!=='candidate'||!memoryState.checks[memory.id])return;memory.status='verified';memory.verification='verified';memory.version+=1;memory.updated='刚刚';memoryState.filter='all';memoryState.notice=memory.claim==='inference'?'已审核并发布，保留模型推断标记':'已审核并发布';render();break}
  case 'disconnect':memoryState.connected=false;closeSheet();render();break;
  case 'import-config':$('#memory-config-input').click();break;
 }
});
document.addEventListener('input',event=>{
 if(['memory-new-title','memory-new-content'].includes(event.target.id))event.target.setCustomValidity('');
 if(event.target.id==='memory-search'){memoryState.query=event.target.value;reconcileMemorySelection();refreshMemoryPane();}
 if(event.target.dataset.memoryField){const memory=selectedMemory();if(memory&&memoryState.drafts[memory.id]){memoryState.drafts[memory.id][event.target.dataset.memoryField]=event.target.value;event.target.setCustomValidity('')}}
});
document.addEventListener('change',event=>{
 if(event.target.id==='memory-type-filter'){memoryState.type=event.target.value;reconcileMemorySelection();render()}
 if(event.target.id==='memory-review-check'){const memory=selectedMemory();if(memory){memoryState.checks[memory.id]=event.target.checked;$('#memory-publish').disabled=!event.target.checked}}
 if(event.target.dataset.memoryField){const memory=selectedMemory();if(memory&&memoryState.drafts[memory.id])memoryState.drafts[memory.id][event.target.dataset.memoryField]=event.target.value}
 if(event.target.id==='memory-config-input'&&event.target.files[0]){const feedback=$('#memory-config-feedback');if(feedback)feedback.textContent='已选择 '+event.target.files[0].name+'；此稿仅预览文件名，未读取配置。';event.target.value=''}
});
document.addEventListener('submit',event=>{
 if(event.target.id==='memory-create-form'){
  event.preventDefault();const title=$('#memory-new-title').value.trim(),content=$('#memory-new-content').value.trim();if(!title||!content){const field=!title?$('#memory-new-title'):$('#memory-new-content');field.setCustomValidity('请填写具体内容');field.reportValidity();return;}
  const memory={id:'memory-'+Date.now(),title,content,type:$('#memory-new-type').value,site:$('#memory-new-site').value.trim(),status:'verified',verification:'verified',claim:'observed',version:1,project:'',scope:'按任务授权使用',tags:[],origin:'user',source:'你手动添加的内容',created:'刚刚',updated:'刚刚',uses:0};
  memoryRecords.unshift(memory);memoryState.filter='all';memoryState.query='';memoryState.type='all';memoryState.selected=memory.id;memoryState.tab='content';memoryState.mobileDetail=true;memoryState.notice='记忆已保存';closeSheet();render();
 }
 if(event.target.id==='memory-inline-form'){event.preventDefault();memorySaveEdit()}
 if(event.target.id==='memory-connection-form'){
  event.preventDefault();const field=$('#memory-connection-url');let valid=false;
  try{const url=new URL(field.value);valid=url.protocol==='https:'&&!url.username&&!url.password}catch{}
  if(!valid){field.setCustomValidity('请输入不含账号信息的 HTTPS 地址');field.reportValidity();field.addEventListener('input',()=>field.setCustomValidity(''),{once:true});return}
  memoryState.url=field.value;memoryState.connected=true;closeSheet();memoryState.notice='已保存示例连接，未发起网络请求';render();
 }
});
document.addEventListener('keydown',event=>{
 if(state.page!=='memories')return;
 if(event.target.matches('.memory-row')&&['ArrowUp','ArrowDown','Home','End'].includes(event.key)){
  event.preventDefault();const list=visibleMemories(),index=list.findIndex(memory=>memory.id===event.target.dataset.memorySelect);
  const next=event.key==='Home'?list[0]:event.key==='End'?list.at(-1):list[index+(event.key==='ArrowDown'?1:-1)];
  if(next)selectMemory(next.id,true);
 }
 if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='f'&&!$('#sheet').open){event.preventDefault();$('#memory-search')?.focus()}
});

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.nav)return navigate(b.dataset.nav);
 if(b.dataset.select)return selectTask(b.dataset.select);
 if(b.dataset.tab){state.tab=b.dataset.tab;render();$('.task-split').classList.add('detail-open');return}
 if(b.dataset.filter){state.filter=b.dataset.filter;const visible=filteredTasks();if(visible.length&&!visible.some(t=>t.id===state.selected))state.selected=visible[0].id;render();return}
 if(b.dataset.inspectorTab){state.inspectorTab=b.dataset.inspectorTab;$('#inspector').innerHTML=inspector();return}
 if(b.dataset.artifact)return artifact(b.dataset.artifact,b.dataset.reviewBack==='true');
 if(b.dataset.searchTask){$('#search-sheet').close();selectTask(b.dataset.searchTask);return}
 if(b.dataset.searchNav){$('#search-sheet').close();navigate(b.dataset.searchNav);return}
 if(b.dataset.answer){task('feedback').status='running';task('feedback').detail='按「'+b.dataset.answer+'」继续整理';render();message('已回答，示例任务继续执行。');return}
 switch(b.dataset.action){
 case 'new':newTask();break;case 'search':search();break;case 'review':review();break;case 'close-sheet':closeSheet();break;
 case 'sidebar':if(innerWidth<=650)$('#app').classList.toggle('mobile-nav');else{state.sidebar=!state.sidebar;$('#app').classList.toggle('collapsed-sidebar',!state.sidebar);$('#show-sidebar').hidden=state.sidebar}break;
 case 'inspector':state.inspector=!state.inspector;render();break;
 case 'refresh':message('设计稿示例已刷新。');break;
 case 'execution':openExecution(b);break;
 case 'task-toggle':{const t=task(state.selected);t.status=t.status==='paused'?'running':'paused';t.detail=t.status==='paused'?'任务已暂停，等待你继续':'正在继续核对资料';render();message(t.status==='paused'?'示例任务已暂停。':'示例任务已继续。');break}
 case 'back-to-list':$('.task-split').classList.remove('detail-open');break;
 case 'attach':$('#attachment-input').click();break;case 'remove-attachment':state.attachment='';render();break;
 case 'return-review':if(!state.reviewNote.trim()){$('#review-note').setCustomValidity('请说明需要补充的内容。');$('#review-note').reportValidity();return}task('report').status='returned';task('report').detail='交付已退回，等待补充';closeSheet();render();message('已退回补充，未重新执行任务。');break;
 case 'browser':sheet('浏览器画面',`<div style="border:1px solid var(--line);border-radius:6px;background:#fff;padding:20px"><div class="row" style="font-size:11px;color:var(--muted)">${icon('globe','sm')}product.example</div><h2 style="font-size:27px;margin:40px 0 10px;color:#53505a">Product updates</h2><p style="font-size:12px;color:var(--muted)">模型正在核对本周的产品功能与定价变化。</p><div style="height:90px;display:flex;gap:10px;margin-top:24px"><span style="background:#f0edf4;border-radius:4px;flex:1"></span><span style="background:#f0edf4;border-radius:4px;flex:1"></span><span style="background:#f0edf4;border-radius:4px;flex:1"></span></div></div><p class="report-note" style="margin-top:14px">示例画面 / 采集于 14:32:08 / Mac Studio</p>`,'<button class="native-button primary" data-action="close-sheet">完成</button>','按需查看 · 此稿不连接真实浏览器');break;
 case 'pair':sheet('连接电脑','<p class="review-copy">在执行 Mac 上打开 Super Agent，生成配对码后在原生客户端完成配对。</p><p class="report-note">此设计稿演示入口，未生成真实配对码。</p>','<button class="native-button primary" data-action="close-sheet">完成</button>');break;
 case 'preferences':sheet('工作台设置','<div class="field"><label>通知</label><label class="row" style="font-size:12px"><input type="checkbox" checked>有问题或交付时提醒我</label></div><p class="review-copy">这是 SwiftUI 原生工作台的 HTML 交互示意。窗口装饰、材质、工具栏和图标在落地时使用系统组件。</p>','<button class="native-button primary" data-action="close-sheet">完成</button>');break;
 case 'accept-memory':state.candidate=false;state.candidateAccepted=true;render();message('已确认保留示例记忆。');break;
 case 'dismiss-memory':state.candidate=false;render();message('候选记忆已移除。');break;
 case 'new-memory':memoryCreate();break;
 case 'toggle-schedule':state.schedule=!state.schedule;render();break;
 case 'new-schedule':sheet('添加定时关注','<form id="schedule-form"><div class="field"><label for="schedule-name">关注内容</label><input id="schedule-name" required></div><div class="field"><label for="schedule-time">每天提醒时间</label><input id="schedule-time" type="time" value="09:00" required></div><p class="report-note">Asia/Shanghai，到点提醒，经你确认后执行。</p></form>','<button class="native-button" data-action="close-sheet">取消</button><button class="native-button primary" form="schedule-form">添加</button>');break;
 }
});
document.addEventListener('submit',e=>{e.preventDefault();switch(e.target.id){
 case 'composer-form':{const text=$('#composer-input').value.trim();if(!text)return;state.messages.push({role:'user',text},{role:'assistant',text:'已收到这条示例消息。正式版本会由所选 Mac 上的助理处理，新的工作方案仍需你确认。'});state.draft='';state.attachment='';render();$('#thread').scrollTop=$('#thread').scrollHeight;$('#composer-input').focus();break}
 case 'new-task-form':{const goal=$('#new-goal').value.trim(),criteria=$('#new-criteria').value.trim();if(!goal||!criteria)return;const id='new-'+Date.now();tasks.unshift({id,title:goal.length>26?goal.slice(0,26)+'…':goal,goal:goal+' 交付标准：'+criteria,status:'queued',engine:$('#new-engine').value,device:$('#new-device').value,detail:'示例任务等待执行，未连接服务',updated:'刚刚',icon:'file-text'});closeSheet();selectTask(id);message('已创建示例任务。');break}
 case 'execution-form':{const engine=$('#exec-engine').value,device=$('#exec-device').value;if(engine==='Grok'&&device==='MacBook Pro'){message('MacBook Pro 尚未配置 Grok，请改选 Codex。');return}state.engine=engine;state.device=device;$('#execution-popover').hidePopover();render();break}
 case 'task-input-form':{const text=$('#task-input').value.trim();if(!text)return;delete state.taskDrafts[state.selected];$('#task-input').value='';message('已将补充要求发送到「'+task(state.selected).title+'」示例任务。');break}
 case 'review-form':if($('#accept-review').disabled)return;task('report').status='done';task('report').detail='已核对全部交付标准与对应证据';closeSheet();render();message('交付已验收，示例任务完成。');break;
 case 'memory-form':{const text=$('#memory-title').value.trim();if(!text)return;state.memories.push([text,'由你添加 / 本次预览']);closeSheet();render();break}
 case 'schedule-form':{const title=$('#schedule-name').value.trim();if(!title)return;state.newSchedules.push({title,time:$('#schedule-time').value});closeSheet();render();break}
 }});
document.addEventListener('input',e=>{if(e.target.id==='composer-input')state.draft=e.target.value;if(e.target.id==='task-input')state.taskDrafts[state.selected]=e.target.value;if(e.target.id==='review-note'){e.target.setCustomValidity('');state.reviewNote=e.target.value;updateReview()}if(e.target.id==='search-input')searchResults(e.target.value.trim())});
document.addEventListener('change',e=>{if(e.target.dataset.reviewCheck!==undefined){state.reviewChecks[Number(e.target.dataset.reviewCheck)]=e.target.checked;updateReview()}if(e.target.dataset.reviewEvidence!==undefined){state.reviewEvidence[Number(e.target.dataset.reviewEvidence)]=e.target.value;updateReview()}if(e.target.id==='attachment-input'&&e.target.files[0]){state.attachment=e.target.files[0].name;render();message('仅预览附件名称，文件未上传。');e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.target.matches('.task-list-item')&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const visible=filteredTasks(),index=visible.findIndex(t=>t.id===e.target.dataset.select),next=visible[index+(e.key==='ArrowDown'?1:-1)];if(next){selectTask(next.id);document.querySelector('.task-list-item[data-select=\"'+next.id+'\"]').focus()}return}const command=e.metaKey||e.ctrlKey;if(command&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#sheet').open&&!$('#search-sheet').open)search()}if(command&&e.key.toLowerCase()==='n'){e.preventDefault();if(!$('#sheet').open&&!$('#search-sheet').open){if(state.page==='memories')memoryCreate();else newTask()}}if(command&&e.key===','){e.preventDefault();document.querySelector('[data-action=preferences]').click()}if(command&&e.key.toLowerCase()==='r'){e.preventDefault();message('设计稿示例已刷新。')}if(command&&e.key==='Enter'&&$('#composer-form')&&!$('#sheet').open&&!$('#search-sheet').open){e.preventDefault();$('#composer-form').requestSubmit()}if(e.key==='Escape')$('#app').classList.remove('mobile-nav')});
const widths={sidebar:208,inspector:282,tasklist:272,'memory-list':300};
function resizeColumn(el,width){const which=el.dataset.resize,min=which==='sidebar'?176:which==='memory-list'?250:235,max=which==='sidebar'?280:380;const next=Math.max(min,Math.min(max,width));widths[which]=next;document.documentElement.style.setProperty('--'+which,next+'px');el.setAttribute('aria-valuenow',String(next))}
document.addEventListener('mousedown',e=>{const el=e.target.closest('[data-resize]');if(!el||e.button!==0)return;e.preventDefault();const start=e.clientX,initial=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--'+el.dataset.resize))||widths[el.dataset.resize],direction=el.dataset.resize==='inspector'?-1:1;document.body.classList.add('resizing');const move=ev=>resizeColumn(el,initial+(ev.clientX-start)*direction);const end=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',end);window.removeEventListener('blur',end);document.body.classList.remove('resizing')};document.addEventListener('mousemove',move);document.addEventListener('mouseup',end);window.addEventListener('blur',end)});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-resize]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const el=e.target,direction=(e.key==='ArrowRight'?1:-1)*(el.dataset.resize==='inspector'?-1:1);resizeColumn(el,(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--'+el.dataset.resize))||widths[el.dataset.resize])+direction*12)}});
window.addEventListener('resize',()=>{$('#show-sidebar').hidden=state.sidebar&&innerWidth>650});
const initialPage=location.hash.slice(1);
if(navs.some(nav=>nav[0]===initialPage))state.page=initialPage;
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(navs.some(nav=>nav[0]===page)&&page!==state.page)navigate(page)});
render();
</script>
</body>
</html>
